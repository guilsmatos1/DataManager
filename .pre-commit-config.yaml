repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: check-ast

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: polylith-check
        name: Polylith Check
        entry: uv tool run --from polylith-cli poly check
        language: system
        pass_filenames: false
        always_run: true

      - id: import-linter
        name: Import Linter
        entry: bash -c "export PYTHONPATH=$PYTHONPATH:components/datamanager/src:components/tradingmonitor_storage/src:components/tradingmonitor_ingestion/src:components/tradingmonitor_analytics/src:components/portfoliomaster/src:components/backtestengine/src:components/core/src:components/mt5/src:components/metalabelingmaster/src:bases/datamanager_api/src:bases/datamanager_cli/src:bases/trading_monitor_dashboard/src:bases/trading_monitor_cli/src:bases/portfolio_master_cli/src:bases/metalabeling_master_cli/src && uv run lint-imports"
        language: system
        pass_filenames: false
        always_run: true

      - id: xenon
        name: Xenon (Complexity Check)
        entry: uv run xenon --max-absolute E --max-modules D --max-average B bases components
        language: system
        pass_filenames: false
        always_run: true

      - id: vulture
        name: Vulture (Dead Code Detection)
        entry: uv run vulture . vulture_whitelist.py --min-confidence 80 --exclude venv,.venv,build,.pytest_cache,.ruff_cache,.mypy_cache,dist,StrategyTester5
        language: system
        pass_filenames: false
        always_run: true
