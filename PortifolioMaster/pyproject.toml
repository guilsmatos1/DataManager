[project]
name = "portifoliomaster"
version = "0.1.0"
description = "MT5 Portfolio Optimization Tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "numpy>=1.26.4",
    "pandas>=2.2.0",
    "plotly>=6.6.0",
    "polars>=1.39.2",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "tqdm>=4.67.3",
]

[project.scripts]
portifoliomaster = "portifoliomaster.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portifoliomaster"]

[[tool.mypy.overrides]]
module = ["pandas.*", "plotly.*", "plotly.graph_objects.*", "tqdm.*", "bs4.*", "pyarrow.*", "lxml.*"]
ignore_missing_imports = true
