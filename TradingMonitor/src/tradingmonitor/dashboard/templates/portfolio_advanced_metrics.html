{% extends "base.html" %}
{% block title %}Advanced Metrics — Portfolio {{ portfolio_id }} — TradingMonitor{% endblock %}

{% block content %}
<div class="page-header">
    <a href="/portfolio/{{ portfolio_id }}" class="back-link">← Portfolio</a>
    <h1>Advanced Metrics <span class="mono" style="font-size:0.75em;color:var(--text-muted)">#{{ portfolio_id }}</span></h1>
</div>

<div class="dashboard-grid">
    <section class="card full-width">
        <div class="section-header">
            <h2>Parameters</h2>
        </div>
        <div class="edit-grid" style="max-width:600px">
            <div class="field-group">
                <span class="field-label">Date From</span>
                <input class="field-input" type="date" id="param-date-from">
            </div>
            <div class="field-group">
                <span class="field-label">Date To</span>
                <input class="field-input" type="date" id="param-date-to">
            </div>
            <div class="field-group">
                <span class="field-label">Initial Balance</span>
                <input class="field-input" type="number" id="param-initial-balance" placeholder="e.g. 10000" step="0.01">
            </div>
        </div>
        <div style="margin-top:1rem">
            <button class="btn btn-primary btn-sm" onclick="calculateMetrics()">Calculate</button>
            <span id="calc-status" style="margin-left:0.75rem;font-size:0.85rem;color:var(--text-muted)"></span>
        </div>
    </section>

    <section class="card full-width" id="results-section" style="display:none">
        <div class="section-header">
            <h2>Results</h2>
            <span id="results-range" class="badge badge-neutral"></span>
        </div>
        <div id="metrics-container" class="metrics-grid"></div>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script>
const PORTFOLIO_ID = {{ portfolio_id }};

// Default: date_from = 1 year ago, date_to = today
(function() {
    const today = new Date();
    const yearAgo = new Date(today);
    yearAgo.setFullYear(yearAgo.getFullYear() - 1);
    document.getElementById("param-date-to").value = today.toISOString().slice(0, 10);
    document.getElementById("param-date-from").value = yearAgo.toISOString().slice(0, 10);
})();

async function calculateMetrics() {
    const dateFrom = document.getElementById("param-date-from").value;
    const dateTo   = document.getElementById("param-date-to").value;
    const initialBalance = document.getElementById("param-initial-balance").value;
    const status = document.getElementById("calc-status");

    status.textContent = "Calculating…";

    const params = new URLSearchParams();
    if (dateFrom) params.set("date_from", dateFrom);
    if (dateTo)   params.set("date_to", dateTo);
    if (initialBalance) params.set("initial_balance", initialBalance);

    try {
        const res = await apiFetch(`/api/portfolios/${PORTFOLIO_ID}/advanced-metrics?${params}`);
        const data = await res.json();
        status.textContent = "";
        renderMetrics(data);
    } catch(e) {
        status.textContent = "❌ Error: " + e.message;
    }
}

function renderMetrics(data) {
    const section = document.getElementById("results-section");
    const container = document.getElementById("metrics-container");

    if (data.error) {
        container.innerHTML = `<p class="empty-state">${data.error}</p>`;
        section.style.display = "block";
        return;
    }

    const INTEGER_KEYS = ["total trades"];
    const GROSS_LOSS_KEY = "gross loss";

    container.innerHTML = Object.entries(data).map(([k, v]) => {
        const keyLower = k.toLowerCase();
        let val, cls = "metric-value";

        if (v === null || v === undefined) {
            val = "—";
        } else if (keyLower === GROSS_LOSS_KEY && typeof v === "number") {
            val = fmt(-v);
            cls = "metric-value profit-negative";
        } else if (typeof v === "number") {
            val = INTEGER_KEYS.includes(keyLower) ? v.toFixed(0) : fmt(v);
            if (keyLower !== "total trades") {
                cls += v >= 0 ? " profit-positive" : " profit-negative";
            }
        } else {
            val = v;
        }

        return `<div class="metric-item">
            <span class="metric-label">${k}</span>
            <span class="${cls}">${val}</span>
        </div>`;
    }).join("");

    section.style.display = "block";

    // Show date range in badge
    const dateFrom = document.getElementById("param-date-from").value;
    const dateTo   = document.getElementById("param-date-to").value;
    const rangeText = dateFrom || dateTo
        ? `${dateFrom || "beginning"} → ${dateTo || "now"}`
        : "All time";
    document.getElementById("results-range").textContent = rangeText;
}
</script>
{% endblock %}
