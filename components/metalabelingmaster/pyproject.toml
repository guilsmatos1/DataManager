[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trademachine-metalabelingmaster"
version = "0.1.0"
description = "Metalabeling Master component"
dependencies = [
    "pandas>=2.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["trademachine*"]
