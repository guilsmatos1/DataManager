[project]
name = "backtestengine-project"
version = "0.1.0"
description = "BacktestEngine build project"
dependencies = [
    "nautilus_trader>=1.224.0",
    "pandas>=2.2.3,<3.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
]

[tool.polylith.projects]
"trademachine/backtestengine" = "components"
"trademachine/core" = "components"
"trademachine/backtest_engine_cli" = "bases"

[tool.uv.sources]
trademachine = { path = "../../components/trademachine" }
trademachine_bases = { path = "../../bases/trademachine" }
