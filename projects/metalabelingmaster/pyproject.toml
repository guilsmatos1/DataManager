[project]
name = "metalabelingmaster-project"
version = "0.1.0"
description = "MetalabelingMaster build project"
dependencies = [
    "pandas>=2.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "typer>=0.12.0"
]

[tool.polylith.projects]
"trademachine/metalabelingmaster" = "components"
"trademachine/mt5" = "components"
"trademachine/metalabeling_master_cli" = "bases"

[tool.uv.sources]
trademachine = { path = "../../components/trademachine" }
trademachine_bases = { path = "../../bases/trademachine" }
