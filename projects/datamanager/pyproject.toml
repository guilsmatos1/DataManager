[project]
name = "datamanager-project"
version = "0.1.0"
description = "DataManager build project"
dependencies = [
    "alembic>=1.18.4",
    "apscheduler>=3.11.2",
    "ccxt>=4.5.44",
    "colorama>=0.4.6",
    "dukascopy-python>=4.0.1",
    "fastapi>=0.128.8",
    "fastparquet>=2025.12.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.0",
    "openbb>=4.7.1",
    "openbb-yfinance>=1.6.0",
    "pandas>=2.2.3,<3.0.0",
    "prompt_toolkit>=3.0.0",
    "psycopg2-binary>=2.9.11",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dateutil>=2.9.0",
    "python-multipart>=0.0.22",
    "requests>=2.32.5",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.48",
    "tenacity>=9.0.0",
    "tqdm>=4.67.3",
    "uvicorn>=0.40.0",
]

[tool.polylith.projects]
"trademachine/datamanager" = "components"
"trademachine/core" = "components"
"trademachine/datamanager_api" = "bases"
"trademachine/datamanager_cli" = "bases"

[tool.uv.sources]
trademachine = { path = "../../components/trademachine" }
trademachine_bases = { path = "../../bases/trademachine" }
