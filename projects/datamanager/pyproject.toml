[project]
name = "datamanager-project"
version = "0.1.0"
description = "DataManager build project"
dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "fastparquet",
    "openbb",
    "pydantic",
    "pydantic-settings"
]

[tool.polylith.projects]
"trademachine/datamanager" = "components"
"trademachine/datamanager_api" = "bases"
"trademachine/datamanager_cli" = "bases"

[tool.uv.sources]
trademachine = { path = "../../components/trademachine" }
trademachine_bases = { path = "../../bases/trademachine" }
