[project]
name = "datamanager-project"
version = "0.1.0"
description = "DataManager build project"
dependencies = [
    "fastapi>=0.128.8",
    "uvicorn>=0.40.0",
    "pandas>=2.2.3,<3.0.0",
    "fastparquet>=2025.12.0",
    "openbb>=4.7.1",
    "openbb-yfinance>=1.6.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "ccxt>=4.5.44",
    "dukascopy-python>=4.0.1",
    "apscheduler>=3.11.2",
    "colorama>=0.4.6",
    "python-dateutil>=2.9.0",
    "prompt_toolkit>=3.0.0",
    "requests>=2.32.5",
    "slowapi>=0.1.9"
]

[tool.polylith.projects]
"trademachine/datamanager" = "components"
"trademachine/core" = "components"
"trademachine/datamanager_api" = "bases"
"trademachine/datamanager_cli" = "bases"

[tool.uv.sources]
trademachine = { path = "../../components/trademachine" }
trademachine_bases = { path = "../../bases/trademachine" }
