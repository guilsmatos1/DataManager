x-casaos:
  architectures:
    - amd64
    - arm64
  main: datamanager_api
  author: guilsmatos
  category: Finance
  description:
    en_us: Centralized financial data management system (OHLCV)
  tagline:
    en_us: Financial Data Manager
  title:
    en_us: DataManager
  icon: https://raw.githubusercontent.com/guilsmatos1/DataManager/main/docs/icon.png
  screenshot: []
  scheme: http
  index: /
  port_map: "8686"
  env:
    - DATABASE_URL

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17-oss
    container_name: datamanager-timescaledb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datamanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-datamanager}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datamanager}"]
      interval: 5s
      timeout: 5s
      retries: 5

  datamanager_api:
    build:
      context: ../..
      dockerfile: projects/datamanager/Dockerfile
    image: guilsmatos/datamanager:latest
    container_name: datamanager-server
    restart: always
    ports:
      - "8686:8686"
    environment:
      - DATAMANAGER_API_KEY=${DATAMANAGER_API_KEY}
      - FRED_API_KEY=${FRED_API_KEY}
      - DATAMANAGER_HOST=0.0.0.0
      - DATAMANAGER_PORT=8686
      - DATAMANAGER_DATABASE_URL=postgresql://${POSTGRES_USER:-datamanager}:${POSTGRES_PASSWORD:-changeme}@timescaledb:5432/${POSTGRES_DB:-datamanager}
    depends_on:
      timescaledb:
        condition: service_healthy
    # volumes:
    #   - ../../metadata:/app/metadata:ro
    #   - ../../bases:/app/bases:ro
    #   - ../../components:/app/components:ro

volumes:
  timescaledb_data:
