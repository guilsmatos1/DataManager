x-casaos:
  architectures:
    - amd64
    - arm64
  main: datamanager_api
  author: guilsmatos
  category: Finance
  description:
    en_us: Centralized financial data management system (OHLCV)
  tagline:
    en_us: Financial Data Manager
  title:
    en_us: DataManager
  icon: https://raw.githubusercontent.com/guilsmatos1/DataManager/main/docs/icon.png
  screenshot: []
  scheme: http
  index: /
  port_map: "8686"
  env:
    - DATAMANAGER_API_KEY
    - DATAMANAGER_DATABASE_URL
    - FRED_API_KEY

services:
  datamanager_api:
    build:
      context: ../..
      dockerfile: projects/datamanager/Dockerfile
    image: guilsmatos/datamanager:latest
    container_name: datamanager-server
    restart: always
    ports:
      - "8686:8686"
    environment:
      - DATAMANAGER_API_KEY=${DATAMANAGER_API_KEY}
      - FRED_API_KEY=${FRED_API_KEY}
      - DATAMANAGER_HOST=0.0.0.0
      - DATAMANAGER_PORT=8686
      - DATAMANAGER_DATABASE_URL=${DATAMANAGER_DATABASE_URL:-postgresql://datamanager_user:changeme@host.docker.internal:5432/datamanager}
    extra_hosts:
      - "host.docker.internal:host-gateway"
