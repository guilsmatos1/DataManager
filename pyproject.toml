[project]
name = "trademachine-workspace"
version = "0.1.0"
description = "Monorepo para os projetos TradeMachine"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
    "DataManager",
    "PortifolioMaster",
    "TradingMonitor",
    "BacktestEngine"
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "S", "PLR"]
ignore = [
    "E501",    # line too long (handled by formatter)
    "S101",    # Use of assert detected (standard in tests)
    "S108",    # Probable insecure usage of temporary file or directory
    "S603",    # subprocess call: check for execution of untrusted input
    "PLR2004", # Magic value used in comparison
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = [
    "DataManager/tests",
    "PortifolioMaster/tests",
    "TradingMonitor/tests"
]
pythonpath = [
    "DataManager/src",
    "PortifolioMaster/src",
    "TradingMonitor/src",
    "TradingMonitor"
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

