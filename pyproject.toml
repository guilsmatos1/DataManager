[project]
name = "trademachine-workspace"
version = "0.1.0"
description = "Monorepo para os projetos TradeMachine"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.128.8",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lxml>=6.0.2",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "plotly>=6.6.0",
    "polars>=1.39.3",
    "psycopg2-binary>=2.9.11",
    "pyarrow>=23.0.1",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.22",
    "quantstats>=0.0.81",
    "sqlalchemy>=2.0.48",
    "tqdm>=4.67.3",
    "uvicorn>=0.40.0",
]

[tool.uv.workspace]
members = [
    "DataManager",
    "PortifolioMaster",
    "TradingMonitor",
    "BacktestEngine"
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "import-linter>=2.11",
    "deptry>=0.25.1",
    "pre-commit>=4.5.1",
    "radon>=6.0.1",
    "xenon>=0.9.3",
    "mutmut>=3.5.0",
    "vulture>=2.15",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "S"]
ignore = ["E501", "S101", "S108", "S603", "B904", "B008", "S110"]

[tool.polylith]
namespace = "trademachine"

[tool.polylith.structure]
theme = "dark"

[tool.polylith.resources]
bases = "bases"
components = "components"

[tool.uv.sources]
trademachine = { workspace = true }

[tool.deptry]
exclude = ["DataManager", "PortifolioMaster", "TradingMonitor", "BacktestEngine", "venv", ".venv", "tests", ".*_cache"]

[tool.mutmut]
paths_to_mutate = "components/"
runner = "python -m pytest"
tests_dir = "tests/"
dict_synonyms = ["Struct"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
    "DataManager/tests",
    "PortifolioMaster/tests",
    "TradingMonitor/tests"
]
pythonpath = [
    "DataManager/src",
    "PortifolioMaster/src",
    "TradingMonitor/src",
    "TradingMonitor",
    "components/datamanager/src",
    "components/tradingmonitor/src",
    "bases/datamanager_api/src",
    "bases/datamanager_cli/src",
    "bases/trading_monitor_dashboard/src",
    "bases/trading_monitor_cli/src",
    "bases/trading_monitor_ingestion/src",
    "components/portifoliomaster/src",
    "bases/portifolio_master_cli/src",
    "components/backtestengine/src",
    "bases/backtest_engine_cli/src"
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
