[project]
name = "datamanager"
version = "0.1.0"
description = "Financial data management system for OHLCV and FRED economic data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.8",
    "uvicorn>=0.40.0",
    "pandas>=2.2.3,<3.0.0",
    "fastparquet>=2025.12.0",
    "openbb>=4.7.1",
    "openbb-yfinance>=1.6.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0.48",
    "psycopg2-binary>=2.9.11",
    "alembic>=1.18.4",
    "ccxt>=4.5.44",
    "dukascopy-python>=4.0.1",
    "apscheduler>=3.11.2",
    "colorama>=0.4.6",
    "python-dateutil>=2.9.0",
    "prompt_toolkit>=3.0.0",
    "requests>=2.32.5",
    "pyarrow>=23.0.1",
    "tenacity>=9.0.0",
    "tqdm>=4.67.3",
]

[project.scripts]
datamanager = "trademachine.datamanager_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trademachine"]

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "integration: marks tests that require external services",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.9.0",
]
