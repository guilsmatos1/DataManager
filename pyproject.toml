[project]
name = "trademachine-datamanager-export"
version = "0.1.0"
description = "Exported TradeMachine partial workspace for datamanager"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "apscheduler>=3.11.2",
    "ccxt>=4.5.44",
    "colorama>=0.4.6",
    "dukascopy-python>=4.0.1",
    "fastapi>=0.128.8",
    "fastparquet>=2025.12.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.0",
    "openbb>=4.7.1",
    "openbb-yfinance>=1.6.0",
    "pandas>=2.2.3,<3.0.0",
    "prompt_toolkit>=3.0.0",
    "psycopg2-binary>=2.9.11",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dateutil>=2.9.0",
    "python-multipart>=0.0.22",
    "requests>=2.32.5",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.48",
    "tenacity>=9.0.0",
    "tqdm>=4.67.3",
    "uvicorn>=0.40.0",
    "trademachine-datamanager",
    "trademachine-core",
    "trademachine-datamanager-api",
    "trademachine-datamanager-cli",
]

[tool.uv.workspace]
members = [
    "projects/datamanager",
    "components/datamanager",
    "components/core",
    "bases/datamanager_api",
    "bases/datamanager_cli",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "import-linter>=2.11",
    "xenon>=0.9.3",
    "vulture>=2.15",
    "polylith-cli>=1.44.0",
]

[tool.uv.sources]
"trademachine-datamanager" = { workspace = true }
"trademachine-core" = { workspace = true }
"trademachine-datamanager-api" = { workspace = true }
"trademachine-datamanager-cli" = { workspace = true }

[tool.polylith]
namespace = "trademachine"

[tool.polylith.test]
enabled = true

[tool.polylith.structure]
theme = "tdd"

[tool.polylith.resources]
bases = "bases"
components = "components"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
    "components/datamanager/test",
    "bases/datamanager_api/test",
    "bases/datamanager_cli/test",
]
pythonpath = [
    "components/datamanager/src",
    "components/core/src",
    "bases/datamanager_api/src",
    "bases/datamanager_cli/src",
]
