[project]
name = "trademachine-workspace"
version = "0.1.0"
description = "Monorepo para os projetos TradeMachine"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "apscheduler>=3.11.2",
    "beautifulsoup4>=4.14.3",
    "ccxt>=4.5.44",
    "colorama>=0.4.6",
    "deap>=1.4.1",
    "dukascopy-python>=4.0.1",
    "fastapi>=0.128.8",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lxml>=6.0.2",
    "nautilus-trader>=1.224.0",
    "numpy>=2.4.3",
    "openbb>=4.7.1",
    "openbb-yfinance>=1.6.0",
    "pandas>=2.2.3,<3.0.0",
    "plotly>=6.6.0",
    "polars>=1.39.3",
    "psycopg2-binary>=2.9.11",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dateutil>=2.9.0.post0",
    "python-json-logger>=2.0.7",
    "python-multipart>=0.0.22",
    "quantstats>=0.0.81",
    "requests>=2.32.5",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.48",
    "tenacity>=9.0.0",
    "tqdm>=4.67.3",
    "typer>=0.24.1",
    "uvicorn>=0.40.0",
]

[tool.uv.workspace]
members = [
    "projects/backtestengine",
    "projects/datamanager",
    "projects/portfoliomaster",
    "projects/tradingmonitor",
    "projects/metalabelingmaster",
    "components/backtestengine_broker",
    "components/backtestengine_history",
    "components/backtestengine_stats",
    "components/backtestengine",
    "components/datamanager",
    "components/tradingmonitor_storage",
    "components/tradingmonitor_ingestion",
    "components/tradingmonitor_analytics",
    "components/portfoliomaster",
    "components/mt5",
    "components/core",
    "components/metrics",
    "components/metalabelingmaster",
    "bases/backtest_engine_cli",
    "bases/datamanager_api",
    "bases/datamanager_cli",
    "bases/trading_monitor_dashboard",
    "bases/trading_monitor_cli",
    "bases/portfolio_master_cli",
    "bases/metalabeling_master_cli"
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "import-linter>=2.11",
    "deptry>=0.25.1",
    "pre-commit>=4.5.1",
    "radon>=6.0.1",
    "xenon>=0.9.3",
    "mutmut>=3.5.0",
    "vulture>=2.15",
    "trademachine-backtestengine-broker>=0.1.0",
    "trademachine-backtestengine-history>=0.1.0",
    "trademachine-backtestengine-stats>=0.1.0",
    "trademachine-backtestengine>=0.1.0",
    "trademachine-backtest-engine-cli>=0.1.0",
    "trademachine-datamanager>=0.1.0",
    "trademachine-tradingmonitor-storage>=0.1.0",
    "trademachine-tradingmonitor-ingestion>=0.1.0",
    "trademachine-tradingmonitor-analytics>=0.1.0",
    "trademachine-portfoliomaster>=0.1.0",
    "trademachine-datamanager-api>=0.1.0",
    "trademachine-datamanager-cli>=0.1.0",
    "trademachine-trading-monitor-dashboard>=0.1.0",
    "trademachine-trading-monitor-cli>=0.1.0",
    "trademachine-portfolio-master-cli>=0.1.0",
    "trademachine-mt5>=0.1.0",
    "trademachine-core>=0.1.0",
    "trademachine-metrics>=0.1.0",
    "pytest-cov>=7.1.0",
    "types-python-dateutil>=2.9.0.20260323",
    "types-requests>=2.32.4.20260324",
    "types-pytz>=2026.1.1.20260402",
    "polylith-cli>=1.44.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "S"]
ignore = ["E501", "S101", "S108", "S603", "B904", "B008", "S110", "B018", "S311"]

[tool.polylith]
namespace = "trademachine"

[tool.polylith.structure]
theme = "tdd"

[tool.polylith.resources]
bases = "bases"
components = "components"

[tool.uv.sources]
trademachine = { workspace = true }
trademachine-backtestengine-broker = { workspace = true }
trademachine-backtestengine-history = { workspace = true }
trademachine-backtestengine-stats = { workspace = true }
trademachine-backtestengine = { workspace = true }
trademachine-backtest-engine-cli = { workspace = true }
trademachine-datamanager = { workspace = true }
trademachine-tradingmonitor-storage = { workspace = true }
trademachine-tradingmonitor-ingestion = { workspace = true }
trademachine-tradingmonitor-analytics = { workspace = true }
trademachine-portfoliomaster = { workspace = true }
trademachine-mt5 = { workspace = true }
trademachine-core = { workspace = true }
trademachine-metrics = { workspace = true }
trademachine-datamanager-api = { workspace = true }
trademachine-datamanager-cli = { workspace = true }
trademachine-trading-monitor-dashboard = { workspace = true }
trademachine-trading-monitor-cli = { workspace = true }
trademachine-portfolio-master-cli = { workspace = true }
trademachine-metalabeling-master-cli = { workspace = true }
trademachine-metalabelingmaster = { workspace = true }

[tool.deptry]
exclude = ["venv", ".venv", "tests", ".*_cache"]
known_first_party = ["trademachine"]
ignore = ["DEP002"]
per_rule_ignores = { DEP001 = "trademachine", DEP003 = "pydantic|colorama|requests|python-dateutil" }

[tool.mutmut]
paths_to_mutate = "components/"
runner = "python -m pytest"
tests_dir = "tests/"
dict_synonyms = ["Struct"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --cov=components --cov-report=term-missing"
testpaths = [
    "components/backtestengine_broker/test",
    "components/backtestengine_history/test",
    "components/backtestengine_stats/test",
    "components/backtestengine/test",
    "bases/backtest_engine_cli/test",
    "components/datamanager/test",
    "components/portfoliomaster/test",
    "bases/portfolio_master_cli/test",
    "components/tradingmonitor_storage/test",
    "components/tradingmonitor_ingestion/test",
    "components/tradingmonitor_analytics/test",
    "bases/trading_monitor_cli/test",
    "bases/trading_monitor_dashboard/test"
]
pythonpath = [
    "components/backtestengine_broker/src",
    "components/backtestengine_history/src",
    "components/backtestengine_stats/src",
    "components/backtestengine/src",
    "bases/backtest_engine_cli/src",
    "projects/backtestengine/src",
    "components/datamanager/src",
    "components/tradingmonitor_storage/src",
    "components/tradingmonitor_ingestion/src",
    "components/tradingmonitor_analytics/src",
    "bases/datamanager_api/src",
    "bases/datamanager_cli/src",
    "bases/trading_monitor_dashboard/src",
    "bases/trading_monitor_cli/src",
    "components/portfoliomaster/src",
    "bases/portfolio_master_cli/src",
    "components/core/src",
    "components/mt5/src"
]
markers = [
    "integration: marks tests that require a real database (deselect with '-m not integration')",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ["build", ".venv", "venv", "dist"]
explicit_package_bases = true
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.vulture]
exclude = ["venv", ".venv", "build"]
