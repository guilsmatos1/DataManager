[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trademachine-portfolio-master-cli"
version = "0.1.0"
description = "trademachine-portfolio-master-cli brick"
dependencies = [
    "trademachine-core",
    "trademachine-portfoliomaster",
    "trademachine-mt5",
]

[project.scripts]
portfoliomaster = "trademachine.portfolio_master_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trademachine*"]
