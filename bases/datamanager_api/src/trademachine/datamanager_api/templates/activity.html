{% extends "base.html" %}
{% block title %}Activity — DataManager{% endblock %}

{% block content %}
<div class="page-header">
    <h1>
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>
        Activity Log
    </h1>
</div>

<div class="card">
    <h2>Recent Operations</h2>
    <div class="table-responsive">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Timestamp <span class="tz-hint">UTC</span></th>
                    <th>Action</th>
                    <th>Target</th>
                    <th>Status</th>
                    <th>Message</th>
                </tr>
            </thead>
            <tbody id="activity-table-body"
                   hx-get="/ui/api/activity" hx-trigger="load" hx-swap="innerHTML">
                <tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 2rem;">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/ui/static/api-client.js"></script>
{% endblock %}
