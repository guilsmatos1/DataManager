[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trademachine-metalabeling-master-cli"
version = "0.1.0"
description = "Metalabeling Master CLI base"
dependencies = [
    "typer>=0.12.0",
    "trademachine-metalabelingmaster",
]

[project.scripts]
metalabelingmaster = "trademachine.metalabeling_master_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trademachine*"]
